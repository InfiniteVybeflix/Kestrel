const wipe=c=>{localStorage.removeItem('k_'+c);localStorage.removeItem('kw_'+c)},saveRoom=()=>putRooms(rooms().map(r=>r.code==code?room:r));

function drawHub(){prune();const l=rooms().sort((a,b)=>b.ts-a.ts);
 $('#rl').replaceChildren(...(l.length?[el('h3','','Your rooms'),...l.map(r=>{const b=el('div','rm'),t=el('span');b.tabIndex=0;b.setAttribute('role','button');
  t.append(el('b','',r.name||r.code),el('span','pv',(r.pv||r.code)+(typeof r.d=='number'?' · ⏳ '+left(r.d-Date.now()):'')));
  const x=el('button','g x','✕');x.title='Delete from this device';x.onclick=e=>{e.stopPropagation();if(confirm('Delete this room from this device?')){wipe(r.code);putRooms(rooms().filter(y=>y.code!=r.code));drawHub()}};
  b.onclick=()=>begin(r.code);b.onkeydown=e=>e.key=='Enter'&&b.click();b.append(t,x);return b})]:[]))}
const defsG=[['name','Display name','text'],['theme','Theme','select',[['auto','Match device'],['day','Light'],['night','Night']]],['accent','Accent colour','select',OPT(AC)],['wp','Chat wallpaper','select',[...OPT(WP),['custom','My photo']]],['dim','Dim wallpaper','range'],['font','Text size','select',[[.9,'Small'],[1,'Normal'],[1.12,'Large'],[1.25,'Huge']]],['bub','Bubble shape','select',[['round','Rounded'],['square','Square']]],['enter','Enter key sends','toggle'],['time','Show message times','toggle'],['sound','Message sound','toggle'],['notif','Notifications when hidden','toggle'],['save','Save chat history on this device','toggle'],['ttl','New messages disappear','select',[[0,'Never'],[86400000,'After 1 day'],[604800000,'After 7 days']]]];

 const b=el('button','g2','Use my own photo as wallpaper');b.onclick=()=>pick(u=>{try{localStorage.kw=u}catch{return toast('Not enough storage for that photo.')}S.wp='custom';saveS();look(room||{});openSettings()});$('#sf').append(b);if(!$('#st').open)$('#st').showModal()}
function openRoom(){build($('#rf'),[['name','Room name','text'],['accent','Room accent','select',[['','Same as app'],...OPT(AC)]],['wp','Room wallpaper','select',[['','Same as app'],...OPT(WP),['custom','My photo']]],['mute','Mute alerts','toggle']],room,()=>{saveRoom();look(room);$('#rt2').textContent=room.name});
 const b=el('button','g2','Use my own photo in this room');b.onclick=()=>pick(u=>{try{localStorage['kw_'+code]=u}catch{return toast('Not enough storage for that photo.')}room.wp='custom';saveRoom();look(room);openRoom()});$('#rf').append(b);
 $('#ri').textContent=typeof room.d=='number'?'This room destroys itself on '+new Date(room.d).toLocaleString()+'.':room.d=='close'?'Destroyed when you close it. Nothing is saved.':'This room stays until someone deletes it.';
 $('#rt2').textContent=room.name;if(!$('#rs').open)$('#rs').showModal()}
$('#gs').onclick=openSettings;$('#sx').onclick=()=>$('#st').close();$('#ro').onclick=openRoom;$('#rx').onclick=()=>$('#rs').close();$('#cc').onclick=()=>$('#cr').close();
$('#kill').onclick=()=>{if(confirm('Destroy this room for everyone in it?')){bc({t:'kill'});setTimeout(()=>nuke('Room destroyed.'),400)}};

<style>
:root{--g:#f2b705;--g2:#ffe08a;--ink:#12202f;--pa:#fff9e8}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{font:16px/1.45 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--pa)}

button{cursor:pointer;border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--ink);color:var(--g2)}

.tile span{position:absolute;left:10px;bottom:8px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}

:root{--bub:#fff;--g3:#ffdc62;--fz:1}
html[data-th=night]{--pa:#0f1824;--ink:#f3e6c4;--g2:#12202f;--bub:#1d2d40}

#home{position:relative;--ink:#12202f;--g2:#ffe08a;color:#12202f}
#room>header{background:linear-gradient(var(--g3),var(--g));color:#12202f}#room>header button,#code{color:#12202f}
.m{background:var(--bub);color:var(--ink)}.m.me{background:color-mix(in srgb,var(--g) 55%,var(--pa))}

.rm>span{flex:1;min-width:0}.rm b{display:block}.pv{display:block;font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm .x{color:#12202f}

.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #8883}.set select,.set input[type=text]{width:auto;max-width:55%;padding:8px;border-radius:10px;border:1px solid #8886;background:var(--bub);color:var(--ink);margin:0}

</style></head><body>
<section id=home><div class=top><button id=inst hidden>Install</button><button id=gs aria-label=Settings>⚙</button></div><div class=card>
<svg viewBox="0 0 64 40" aria-hidden=true><path d="M2 20C16 2 28 8 32 24 36 8 48 2 62 20 50 16 40 22 32 38 24 22 14 16 2 20Z" fill="#12202f"/></svg>
<h1>Kestrel</h1><p>Private rooms. No accounts. Just you and your people.</p>
<input id=nm placeholder="Your name" maxlength=24 autocomplete=nickname aria-label="Your name">
<button id=mk>Create a room</button><div class=or>or enter a code</div>
<div class=row><input id=cd placeholder="ABC-DEF" maxlength=7 aria-label="Room code"><button id=en>Enter</button></div>
<div id=rl></div><small>Messages and calls go straight between browsers, encrypted. Nothing is stored on a server.</small></div></section>

<section id=room hidden>
<header><button class=g id=bk aria-label=Leave>‹</button><div class=t><button id=code title="Copy invite link"></button><span id=sub></span></div>
<select id=ex aria-label="Disappearing messages"><option value=0>Keep</option><option value=86400000>1 day</option><option value=604800000>7 days</option></select>
<button class=g id=vc aria-label="Voice call">📞</button><button class=g id=vv aria-label="Video call">🎥</button><button class=g id=ro aria-label="Room settings">⚙</button></header>
<div id=ring hidden><span id=rt></span><button id=j1>Join</button><button id=j2>Join with video</button></div>
<div id=msgs aria-live=polite></div><div id=rp hidden></div>
<footer><label class=g style="cursor:pointer;padding:8px">📎<input id=fi type=file accept="image/*" hidden></label>
<input id=tx type=text placeholder="Message" autocomplete=off aria-label=Message><button class=g id=mc aria-label="Hold to record">🎙</button><button id=sd aria-label=Send>➤</button></footer></section>

<div id=toast hidden></div>
<dialog id=cr><form method=dialog><h2>New room</h2><input id=rn type=text placeholder="Room name (optional)" maxlength=30>

<dialog id=st><h2>Settings</h2><div id=sf></div><p class=hint id=ih></p><div class=btns><button class=g2 id=wipe>Clear all data</button><button id=sx>Done</button></div></dialog>

<script type=module>
import {makeCode,normCode,addMsg,destroyAt,expired,left} from './core.js';
import {S,saveS,rooms,putRooms,look,build,J,AC,WP} from './ui.js';
const $=s=>document.querySelector(s),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const OK=/^data:(image|audio)\/[\w.+-]+(;codecs=[\w.]+)?;base64,[A-Za-z0-9+\/=]+$/;
const uid=localStorage.ku||=crypto.randomUUID();
let name=S.name,room,code,hostId,me,peer,host,msgs=[],reply=null,local=null,dirty=0,rec;
const conns=new Map(),calls=new Map(),inCall=new Set(),pend=new Set();
$('#nm').value=name;const h0=normCode(location.hash.slice(1));if(h0)$('#cd').value=h0;
const claim=id=>new Promise((ok,no)=>{const p=id?new Peer(id):new Peer();p.on('open',()=>ok(p));p.on('error',no)});
const bc=d=>conns.forEach(p=>p.c.open&&p.c.send(d)),persist=()=>S.save&&room.d!='close',
 save=()=>{if(!persist())return;const real=msgs.filter(m=>!m.s).slice(-200),k='k_'+code;try{localStorage[k]=JSON.stringify(real)}catch{localStorage[k]=JSON.stringify(real.map(m=>({...m,a:''})))}
  const l=real[real.length-1];room.ts=Date.now();room.pv=l?(l.by+': '+(l.t||'📎')).slice(0,60):'';saveRoom()};
const sys=t=>{addMsg(msgs,{id:crypto.randomUUID(),ts:Date.now(),s:1,t});draw()};
const count=()=>$('#sub').textContent=(conns.size?`${conns.size+1} in this room`:'Only you here. Share the code.')+tail();
const tail=()=>typeof room.d=='number'?' · ⏳ '+left(room.d-Date.now()):room.d=='close'?' · 🔥 not saved':'';
const fail=()=>{$('#sub').textContent='Offline';sys("Can't reach the connection service. Check your internet and reopen the room.")};

async function begin(raw,o={}){const c=normCode(raw);if(!c)return alert('Room codes look like ABC-DEF.');
 name=$('#nm').value.trim();if(!name){$('#nm').focus();return alert('Pick a name first.')}
 S.name=name;saveS();code=c;hostId='kestrel-'+c.toLowerCase();history.replaceState(null,'','#'+c);
 let l=rooms();room=l.find(r=>r.code==c);if(!room){room={code:c,name:o.name||c,d:o.d||'never',ts:Date.now(),j:o.made?0:1};l.push(room);putRooms(l)}
 if(expired(room))return nuke('That room expired and was destroyed.');look(room);$('#ex').value=S.ttl||0;msgs=persist()?J('k_'+c,[]):[];$('#home').hidden=true;$('#room').hidden=false;$('#code').textContent=c;$('#sub').textContent='Connecting…';draw();
 try{peer=await claim(hostId);host=true}catch(e){if(e.type!='unavailable-id')return fail();try{peer=await claim();host=false}catch{return fail()}}

 peer.on('error',e=>{if(e.type=='peer-unavailable'&&String(e.message).includes(hostId)){peer.destroy();begin(c)}});
 if(host){sys('Room open. Share the code or tap it to copy an invite link.');count()}else link(hostId)}
function link(id){if(id==me||conns.has(id)||pend.has(id))return;pend.add(id);setup(peer.connect(id,{serialization:'json'}))}
function setup(c){
 c.on('open',()=>{pend.delete(c.peer);if(conns.has(c.peer))return c.close();conns.set(c.peer,{c,name:'Someone'});
  c.send({t:'hi',name,list:[...conns.keys()]});c.send({t:'cfg',name:room.name,d:room.d});c.send({t:'h',m:msgs.filter(m=>!m.s).slice(-50)});if(local)c.send({t:'cs',on:1});count()});
 c.on('data',d=>{const p=conns.get(c.peer);if(!p||!d)return;
  if(d.t=='hi'){p.name=String(d.name||'Someone').slice(0,24);sys(p.name+' joined');if(c.peer==hostId)(d.list||[]).forEach(link);count()}
  else if(d.t=='h')(d.m||[]).forEach(got);else if(d.t=='m')got(d.m);else if(d.t=='rx')react(d.id,d.e,0);
  else if(d.t=='cfg'){if(room.j){room.j=0;if(d.name)room.name=String(d.name).slice(0,30);if(d.d=='close'||d.d=='never')room.d=d.d;else if(+d.d)room.d=+d.d;saveRoom();look(room);count()}}else if(d.t=='kill')nuke('This room was destroyed by a member.');else if(d.t=='cs'){d.on?inCall.add(c.peer):inCall.delete(c.peer);ring();if(d.on)maybeCall(c.peer)}});
 c.on('close',()=>{pend.delete(c.peer);const p=conns.get(c.peer);if(p&&p.c==c){conns.delete(c.peer);inCall.delete(c.peer);sys(p.name+' left');count();ring()}})}
function got(m){if(!m||!m.id||typeof m.by!='string')return;
 const s={id:String(m.id).slice(0,50),u:String(m.u||'').slice(0,50),by:m.by.slice(0,24),ts:+m.ts||Date.now(),t:String(m.t||'').slice(0,4000),a:OK.test(m.a)?m.a:'',re:String(m.re||''),x:+m.x||0,r:Array.isArray(m.r)?m.r.slice(0,50).map(String):[]};
 if(addMsg(msgs,s)){save();draw();if(!room.mute){if(document.hidden){document.title='● Kestrel';if(S.notif&&Notification.permission=='granted')new Notification(room.name,{body:'New message'})}if(S.sound)beep()}}}
function post(o){const ttl=+$('#ex').value,m={id:crypto.randomUUID(),u:uid,by:name,ts:Date.now(),t:'',a:'',re:reply?reply.id:'',x:ttl?Date.now()+ttl:0,r:[],...o};
 reply=null;$('#rp').hidden=true;addMsg(msgs,m);save();draw();bc({t:'m',m})}
function react(id,e,mine){const m=msgs.find(x=>x.id==id);if(m&&m.r.length<50){m.r.push(String(e));save();draw()}if(mine)bc({t:'rx',id,e})}
const playing=()=>[...document.querySelectorAll('audio')].some(a=>!a.paused);
function draw(){if(playing()){dirty=1;return}const now=Date.now(),box=$('#msgs'),by=new Map(msgs.map(m=>[m.id,m]));
 box.replaceChildren(...msgs.filter(m=>!m.x||m.x>now).map(m=>{if(m.s)return el('div','sys',m.t);
  const d=el('div','m'+(m.u==uid?' me':''));if(m.u!=uid)d.append(el('div','by',m.by));
  const q=by.get(m.re);if(q)d.append(el('div','q',q.t?q.t.slice(0,70):'Attachment'));
  if(m.t)d.append(el('div','',m.t));
  if(m.a){const a=m.a.startsWith('data:image')?el('img'):el('audio');a.src=m.a;if(a.tagName=='AUDIO')a.controls=true;d.append(a)}
  if(m.r.length)d.append(el('div','',m.r.join(' ')));
  if(S.time)d.append(el('time','',new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})));
  const bar=el('div','acts');bar.hidden=true;
  [['↩',()=>{reply=m;$('#rp').hidden=false;$('#rp').textContent='Replying to '+m.by+'  ✕'}],...['👍','❤️','😂'].map(e=>[e,()=>react(m.id,e,1)])]
   .forEach(([t,f])=>{const b=el('button','g',t);b.onclick=ev=>{ev.stopPropagation();f();bar.hidden=true};bar.append(b)});
  d.append(bar);d.onclick=()=>bar.hidden=!bar.hidden;return d}));box.scrollTop=box.scrollHeight}
document.addEventListener('pause',()=>{if(dirty&&!playing()){dirty=0;draw()}},true);document.addEventListener('ended',()=>{dirty=0;draw()},true);
setInterval(()=>{if(code){if(expired(room))return nuke('This room expired and was destroyed.');count();draw()}},30000);addEventListener('focus',()=>document.title='Kestrel');

// Calls: full mesh, the higher peer id always dials, so pairs never double-connect.
function tile(id,s,self){untile(id);const t=el('div','tile');t.id='t-'+id;const v=el('video');v.srcObject=s;v.autoplay=true;v.playsInline=true;v.muted=!!self;
 t.append(v,el('span','',self?'You':conns.get(id)?.name||'Guest'));$('#tiles').append(t)}
const untile=id=>document.getElementById('t-'+id)?.remove();
const hook=(id,c)=>{calls.set(id,c);c.on('stream',s=>tile(id,s));c.on('close',()=>{calls.delete(id);untile(id)})};
const maybeCall=id=>{if(local&&!calls.has(id)&&conns.has(id)&&me>id)hook(id,peer.call(id,local))};
function onCall(c){if(!local||calls.has(c.peer))return c.close();c.answer(local);hook(c.peer,c)}
async function joinCall(v){if(local)return;try{local=await navigator.mediaDevices.getUserMedia({audio:true,video:v})}catch{return alert('Allow microphone'+(v?' and camera':'')+' access to join the call.')}
 $('#call').hidden=false;$('#cam').hidden=!v;tile('me',local,1);bc({t:'cs',on:1});inCall.forEach(maybeCall);ring()}
function leaveCall(){calls.forEach(c=>c.close());calls.clear();local?.getTracks().forEach(t=>t.stop());local=null;$('#tiles').replaceChildren();$('#call').hidden=true;bc({t:'cs',on:0});ring()}
function ring(){$('#ring').hidden=!(inCall.size&&!local);$('#rt').textContent=`📞 ${inCall.size} in a call`}
const flip=(kind,b)=>{const t=local?.[kind]()[0];if(t){t.enabled=!t.enabled;$(b).style.opacity=t.enabled?1:.4}};

// Attachments
const rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function shrink(f,mx=800,lim=250000){const im=await createImageBitmap(f),sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 for(let q=.8;q>.2;q-=.1){const u=c.toDataURL('image/jpeg',q);if(u.length<lim)return u}alert('That image is too large to send.')}
async function mic(on){if(on){let s;try{s=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return alert('Allow microphone access to record.')}
 const ch=[];rec=new MediaRecorder(s,{audioBitsPerSecond:24000});rec.ondataavailable=e=>ch.push(e.data);
 rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());const u=await rd(new Blob(ch,{type:rec.mimeType}));u.length<400000?post({a:u}):alert('Voice note too long (60 s max).')};
 rec.start();setTimeout(()=>rec.state=='recording'&&rec.stop(),60000)}else if(rec?.state=='recording')rec.stop()}

// Wiring
$('#mk').onclick=()=>{$('#rn').value='';$('#cr').returnValue='';$('#cr').showModal()};$('#en').onclick=()=>begin($('#cd').value);$('#cd').onkeydown=e=>e.key=='Enter'&&begin($('#cd').value);
$('#sd').onclick=()=>{const t=$('#tx').value.trim();if(t){$('#tx').value='';post({t})}};$('#tx').onkeydown=e=>e.key=='Enter'&&S.enter&&$('#sd').click();
$('#fi').onchange=async e=>{const u=e.target.files[0]&&await shrink(e.target.files[0]);if(u)post({a:u});e.target.value=''};
$('#mc').onpointerdown=()=>mic(1);$('#mc').onpointerup=$('#mc').onpointerleave=()=>mic(0);
$('#rp').onclick=()=>{reply=null;$('#rp').hidden=true};
$('#code').onclick=()=>{navigator.clipboard?.writeText(location.origin+location.pathname+'#'+code);$('#sub').textContent='Invite link copied';setTimeout(count,1500)};
$('#vc').onclick=()=>joinCall(false);$('#vv').onclick=()=>joinCall(true);$('#j1').onclick=()=>joinCall(false);$('#j2').onclick=()=>joinCall(true);
$('#mic').onclick=()=>flip('getAudioTracks','#mic');$('#cam').onclick=()=>flip('getVideoTracks','#cam');$('#end').onclick=leaveCall;
$('#bk').onclick=()=>{history.replaceState(null,'',location.pathname);location.reload()};
</script></body></html>
